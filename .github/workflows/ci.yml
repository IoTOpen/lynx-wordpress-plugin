name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: PHP syntax check
        run: find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run build
      - run: npm run plugin-zip

      - uses: actions/upload-artifact@v4
        with:
          name: iot-open-lynx
          path: iot-open-lynx.zip

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: iot-open-lynx.zip

  deploy-wordpress-org:
    # Publishes tagged releases to the WordPress.org plugin directory.
    # Needs the repository secrets SVN_USERNAME and SVN_PASSWORD (a WordPress.org
    # account with commit access to the plugin); skipped until they are set.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        if: env.SVN_USERNAME != ''

      - uses: actions/download-artifact@v4
        if: env.SVN_USERNAME != ''
        with:
          name: iot-open-lynx

      - name: Unpack plugin
        if: env.SVN_USERNAME != ''
        run: unzip -q iot-open-lynx.zip -d dist

      - uses: 10up/action-wordpress-plugin-deploy@stable
        if: env.SVN_USERNAME != ''
        env:
          SLUG: iot-open-lynx
          BUILD_DIR: dist/iot-open-lynx
          ASSETS_DIR: .wordpress-org
