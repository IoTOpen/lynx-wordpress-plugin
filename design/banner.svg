<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#11506a"/>
			<stop offset="1" stop-color="#0a2f40"/>
		</linearGradient>
		<linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#12b1be" stop-opacity="0.35"/>
			<stop offset="1" stop-color="#12b1be" stop-opacity="0"/>
		</linearGradient>
		<pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
			<circle cx="20" cy="20" r="3" fill="#ffffff" fill-opacity="0.07"/>
		</pattern>
		<filter id="blur" x="-20%" y="-20%" width="140%" height="160%">
			<feGaussianBlur stdDeviation="18"/>
		</filter>
	</defs>

	<rect width="1544" height="500" fill="url(#bg)"/>
	<rect x="760" width="784" height="500" fill="url(#dots)"/>

	<!-- Value history across the background -->
	<path d="M0 430 L160 400 L300 418 L460 360 L600 384 L760 312 L900 340 L1040 262 L1180 290 L1320 214 L1544 236 L1544 500 L0 500 Z" fill="url(#area)"/>
	<path d="M0 430 L160 400 L300 418 L460 360 L600 384 L760 312 L900 340 L1040 262 L1180 290 L1320 214 L1544 236" fill="none" stroke="#12b1be" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

	<!-- Title -->
	<text x="96" y="196" font-family="Inter" font-weight="800" font-size="92" fill="#ffffff" letter-spacing="-2">IoT Open Lynx</text>
	<text x="98" y="262" font-family="Inter" font-weight="500" font-size="38" fill="#b4dbea">Live values from your sensors,</text>
	<text x="98" y="312" font-family="Inter" font-weight="500" font-size="38" fill="#b4dbea">right in your WordPress pages.</text>

	<!-- Value card -->
	<rect x="1032" y="102" width="400" height="236" rx="22" fill="#000000" fill-opacity="0.35" filter="url(#blur)"/>
	<rect x="1032" y="88" width="400" height="236" rx="22" fill="#ffffff"/>
	<text x="1072" y="150" font-family="Inter" font-weight="600" font-size="26" fill="#4b5563">Water temperature</text>
	<text x="1070" y="242" font-family="Inter" font-weight="800" font-size="86" fill="#0d3e53" letter-spacing="-2">18.4 °C</text>
	<circle cx="1082" cy="284" r="8" fill="#12b1be"/>
	<text x="1102" y="293" font-family="Inter" font-weight="500" font-size="24" fill="#6b7280">Live · updated 12:04</text>
</svg>
